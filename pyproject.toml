[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "spark-project"
version = "0.1.0"
description = "Notebook-led analysis and portable Spark jobs"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark[connect]==3.5.3",
    "pyarrow>=16,<18",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<7",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<0.14",
    "numpy>=1.26,<2",
    "folium>=0.20.0",
    "itables>=2.9.1",
]

[dependency-groups]
dev = ["ruff>=0.11,<1", "nbformat>=5,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src/spark_project"]

[tool.ruff]
target-version = "py311"
line-length = 100
